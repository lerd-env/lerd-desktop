name: Package for macOS

# Packages Lerd-<arch>.dmg. Every push and pull request keeps them as run
# artifacts; a published release also gets them as assets.

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  package:
    name: Package
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm test

      - run: npm run package:mac

      - uses: actions/upload-artifact@v4
        with:
          name: lerd-desktop-macos
          path: dist/Lerd-*.dmg
          if-no-files-found: error

      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/Lerd-x64.dmg dist/Lerd-arm64.dmg --clobber
