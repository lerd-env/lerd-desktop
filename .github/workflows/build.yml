name: Build Flatpak

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  flatpak:
    name: Build
    runs-on: ubuntu-latest
    container:
      # Bump the freedesktop tag to match runtime-version in the manifest.
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-24.08
      options: --privileged
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: flathub-infra/flatpak-github-actions/flatpak-builder@933e9e8ca36e85046ebca8e211f0785c6becac40 # master
        with:
          bundle: Lerd.flatpak
          manifest-path: flatpak/sh.lerd.Desktop.yml
          cache-key: flatpak-builder-${{ github.sha }}
